{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-3">Восстановление пароля</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                <label class="form-label">Email</label>
                {{ form.email }}
                {{ form.email.errors }}
            </div>
            <button class="btn btn-primary" type="submit">Отправить письмо</button>
        </form>
    </div>
</div>
{% endblock %}
