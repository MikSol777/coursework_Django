{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-3">Вход</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                <label class="form-label">Email</label>
                {{ form.username }}
                {{ form.username.errors }}
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                {{ form.password }}
                {{ form.password.errors }}
            </div>
            <button class="btn btn-primary" type="submit">Войти</button>
            <a class="btn btn-link" href="{% url 'users:password_reset' %}">Забыли пароль?</a>
        </form>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрируйтесь</a>.</p>
    </div>
</div>
{% endblock %}
