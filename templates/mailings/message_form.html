{% extends 'base.html' %}

{% block title %}Сообщение{% endblock %}

{% block content %}
<h1 class="mb-3">Сообщение</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
        <label class="form-label">Тема</label>
        {{ form.subject }}
        {{ form.subject.errors }}
    </div>
    <div class="mb-3">
        <label class="form-label">Текст</label>
        {{ form.body }}
        {{ form.body.errors }}
    </div>
    <button class="btn btn-primary" type="submit">Сохранить</button>
</form>
{% endblock %}
