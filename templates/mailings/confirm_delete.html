{% extends 'base.html' %}

{% block title %}Удаление{% endblock %}

{% block content %}
<h1>Удалить запись?</h1>
<p>Вы уверены, что хотите удалить объект «{{ object }}»?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-secondary" href="javascript:history.back()">Отмена</a>
 </form>
{% endblock %}
