{% extends 'base.html' %}

{% block title %}{{ client.full_name }}{% endblock %}

{% block content %}
<h1>{{ client.full_name }}</h1>
<p class="text-muted">{{ client.email }}</p>
<p>{{ client.comment|linebreaks }}</p>
{% if client.owner == user %}
    <div class="mt-3">
        <a class="btn btn-outline-primary" href="{% url 'mailings:client_edit' client.pk %}">Изменить</a>
        <a class="btn btn-outline-danger" href="{% url 'mailings:client_delete' client.pk %}">Удалить</a>
    </div>
{% endif %}
{% endblock %}
