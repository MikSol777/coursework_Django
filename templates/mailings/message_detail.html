{% extends 'base.html' %}

{% block title %}{{ message.subject }}{% endblock %}

{% block content %}
<h1>{{ message.subject }}</h1>
<p class="text-muted">Создано {{ message.created_at|date:"d.m.Y H:i" }}</p>
<div class="card">
    <div class="card-body">
        {{ message.body|linebreaks }}
    </div>
</div>
{% if message.owner == user %}
    <div class="mt-3">
        <a class="btn btn-outline-primary" href="{% url 'mailings:message_edit' message.pk %}">Изменить</a>
        <a class="btn btn-outline-danger" href="{% url 'mailings:message_delete' message.pk %}">Удалить</a>
    </div>
{% endif %}
{% endblock %}
